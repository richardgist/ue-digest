<h1 class="title">搜索 / 收藏</h1><p class="lead">在 UE 日报、每日精选、订阅源的全部内容里统一搜索;也可以只看未读或已收藏(跨栏目)。</p><div class="tools" id="tools"><input id="q" type="search" placeholder="全文搜索:标题、摘要、来源、命令、版本…" aria-label="搜索"><div class="filters" id="secf" role="group" aria-label="栏目筛选"><button type="button" class="f active" data-sec="">全部栏目</button><button type="button" class="f" data-sec="ue">UE 日报</button><button type="button" class="f" data-sec="picks">每日精选</button><button type="button" class="f" data-sec="feeds">订阅源</button></div><div class="filters" id="topicf" role="group" aria-label="主题筛选"><button type="button" class="f active" data-topic="">全部主题</button><span class="glabel">UE 日报</span><button type="button" class="f" data-topic="渲染">渲染</button><button type="button" class="f" data-topic="HLOD">HLOD</button><button type="button" class="f" data-topic="移动端">移动端</button><span class="glabel">每日精选</span><button type="button" class="f" data-topic="效率">效率</button><button type="button" class="f" data-topic="工具">工具</button><button type="button" class="f" data-topic="前沿">前沿</button><span class="glabel">订阅源</span><button type="button" class="f" data-topic="图形渲染">图形渲染</button><button type="button" class="f" data-topic="游戏开发">游戏开发</button><button type="button" class="f" data-topic="AI 工具">AI 工具</button></div><div class="filters" id="statusf" role="group" aria-label="状态筛选"><button type="button" class="f active" data-st="">全部</button><button type="button" class="f" data-st="unread">只看未读</button><button type="button" class="f" data-st="star">★ 已收藏</button></div><div class="bar2"><span id="counter" class="counter">未读 <b id="unread">0</b> / 共 <b id="total">0</b></span><span class="sp"></span><button type="button" id="markall" class="btn sm">全部标记已读</button><button type="button" id="readmode" class="btn sm" aria-pressed="false">阅读模式</button></div><details class="adv"><summary>更多筛选与数据</summary><div class="advbody"><div class="row"><label>起始日期 <input type="date" id="from"></label><label>截止日期 <input type="date" id="to"></label><label>排序 <select id="sort"><option value="new">最新优先</option><option value="old">最早优先</option></select></label><button type="button" id="resetf" class="btn sm">清除筛选</button></div><div class="row data"><button type="button" id="export" class="btn sm">导出已读/收藏(JSON)</button><button type="button" id="import" class="btn sm">导入(合并)</button><button type="button" id="importreplace" class="btn sm">导入(覆盖)</button><input type="file" id="file" accept="application/json,.json" hidden></div><p class="note">已读和收藏只保存在当前浏览器(localStorage)。换设备或换浏览器前先导出,到另一边导入即可同步。</p></div></details><p id="status" class="status" aria-live="polite"></p><p class="keys">快捷键:j / k 上下条 · o 打开原文 · e 展开 · s 收藏 · m 已读/未读 · / 搜索</p></div><div id="list"></div><p id="empty" class="empty" hidden>没有匹配的内容。</p><p class="center"><button type="button" id="more" class="btn" hidden>显示更多</button></p>
